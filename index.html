
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR IPM</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 22px;
      background: #070e22;
      color: #e5edff;
      font-family: Arial, sans-serif;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      background: #101b36;
      border: 1px solid #30466e;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 18px 50px #0006;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .muted { color: #9aabc9; font-size: 14px; line-height: 1.5; }
    #reader {
      width: 100%;
      margin: 18px 0;
      border-radius: 12px;
      overflow: hidden;
      background: #071126;
      min-height: 240px;
    }
    button, select {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
    }
    button { background: #2563eb; color: white; cursor: pointer; }
    button.secondary { background: #24395f; color: #dbe7ff; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    select {
      background: #0b1630;
      color: #e5edff;
      border: 1px solid #45669b;
    }
    .status {
      padding: 12px;
      border-radius: 10px;
      background: #0b1630;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .ok { background: #064e3b; color: #d1fae5; }
    .err { background: #7f1d1d; color: #fee2e2; }

    /* POPUP KONFIRMASI */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.78);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 360px;
      padding: 28px 22px;
      text-align: center;
      background: #101b36;
      border: 1px solid #30466e;
      border-radius: 20px;
      box-shadow: 0 15px 50px #0008;
    }
    .modal-icon { font-size: 60px; margin-bottom: 12px; }
    .modal-title { font-size: 23px; font-weight: 800; margin-bottom: 10px; }
    .modal-message { color: #cbd5e1; line-height: 1.6; font-size: 14px; }
    .modal.success .modal-title { color: #34d399; }
    .modal.error .modal-title { color: #f87171; }
  </style>
</head>

<body>
<main class="wrap">
  <h1>Scanner QR Code IPM</h1>
  <p class="muted">
    Arahkan kamera ke QR Code peserta. Hasil pemindaian akan dikirim
    kembali ke halaman absensi Musycab.
  </p>

  <select id="camera-select">
    <option value="">Memuat kamera...</option>
  </select>

  <div id="reader"></div>

  <button id="start-btn" type="button">Mulai Scan</button>
  <button id="stop-btn" type="button" class="secondary" disabled>
    Hentikan Kamera
  </button>

  <div id="status" class="status">
    Menunggu kamera. Tekan Mulai Scan.
  </div>
</main>

<!-- POPUP -->
<div id="result-modal" class="modal">
  <div class="modal-box">
    <div id="modal-icon" class="modal-icon">✓</div>
    <div id="modal-title" class="modal-title">Absensi Berhasil!</div>
    <div id="modal-message" class="modal-message">
      Data kehadiran berhasil disimpan.
    </div>
    <button id="close-modal" type="button">Tutup</button>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const returnOrigin = params.get('returnOrigin');

  const statusEl = document.getElementById('status');
  const select = document.getElementById('camera-select');
  const startBtn = document.getElementById('start-btn');
  const stopBtn = document.getElementById('stop-btn');
  const modal = document.getElementById('result-modal');

  let scanner = null;
  let cameras = [];
  let sent = false;
  let waitingResult = false;
  let scanTimeout = null;

  function status(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  function showResult(success, message, name) {
    modal.className = 'modal show ' + (success ? 'success' : 'error');

    document.getElementById('modal-icon').textContent =
      success ? '✓' : '✕';

    document.getElementById('modal-title').textContent =
      success ? 'ABSENSI BERHASIL!' : 'ABSENSI GAGAL!';

    document.getElementById('modal-message').textContent =
      (name ? name + '. ' : '') + message;

    document.getElementById('close-modal').textContent =
      'Tutup';

    status(message, success ? 'ok' : 'err');
  }

  function validReturnOrigin(value) {
    try {
      const u = new URL(value);
      return u.protocol === 'https:' &&
        u.origin === value.replace(/\/$/, '');
    } catch (e) {
      return false;
    }
  }

  if (!window.opener || !returnOrigin ||
      !validReturnOrigin(returnOrigin)) {
    status(
      'Buka scanner melalui tombol Scanner Eksternal dari dashboard absensi.',
      'err'
    );
    startBtn.disabled = true;
    return;
  }

  async function loadCameras() {
    cameras = await Html5Qrcode.getCameras();
    select.innerHTML = '';

    if (!cameras.length) {
      throw new Error('Kamera tidak ditemukan.');
    }

    cameras.forEach((camera, index) => {
      const option = document.createElement('option');
      option.value = camera.id;
      option.textContent = camera.label || ('Kamera ' + (index + 1));
      select.appendChild(option);
    });

    const back = cameras.find(c =>
      /back|rear|environment|belakang/i.test(c.label || '')
    );

    if (back) select.value = back.id;
  }

  async function stopCamera() {
    if (scanner) {
      try {
        if (scanner.isScanning) await scanner.stop();
      } catch (e) {}

      try {
        scanner.clear();
      } catch (e) {}

      scanner = null;
    }

    stopBtn.disabled = true;
  }

  async function start() {
    if (scanner || waitingResult) return;

    if (typeof Html5Qrcode === 'undefined') {
      status('Library scanner gagal dimuat.', 'err');
      return;
    }

    startBtn.disabled = true;

    try {
      await loadCameras();

      scanner = new Html5Qrcode('reader');

      const cameraId = select.value || {
        facingMode: 'environment'
      };

      await scanner.start(
        cameraId,
        {
          fps: 12,
          qrbox: (width, height) => {
            const size = Math.floor(Math.min(width, height) * .78);
            return { width: size, height: size };
          },
          aspectRatio: 1
        },
        async decodedText => {
          if (sent || waitingResult) return;

          sent = true;
          waitingResult = true;

          await stopCamera();

          status(
            'QR terbaca. Mengirim data dan menunggu konfirmasi dashboard...',
            ''
          );

          stopBtn.disabled = true;

          try {
            window.opener.postMessage({
              type: 'IPM_QR_SCAN',
              text: decodedText
            }, returnOrigin);

            scanTimeout = setTimeout(() => {
              if (waitingResult) {
                waitingResult = false;
                sent = false;
                showResult(
                  false,
                  'Dashboard belum memberikan konfirmasi. Periksa koneksi dashboard dan coba scan ulang.'
                );
                startBtn.disabled = false;
              }
            }, 20000);

          } catch (err) {
            waitingResult = false;
            sent = false;
            showResult(false, 'Gagal mengirim hasil QR ke dashboard.');
            startBtn.disabled = false;
          }
        },
        () => {}
      );

      stopBtn.disabled = false;
      status('Kamera aktif. Arahkan QR Code ke kotak pemindai.', 'ok');

    } catch (err) {
      console.error(err);
      scanner = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      status(
        'Kamera gagal dijalankan: ' + (err.message || err),
        'err'
      );
    }
  }

  async function stop() {
    await stopCamera();
    startBtn.disabled = false;
    status('Kamera dihentikan. Tekan Mulai Scan untuk mencoba lagi.');
  }

  // MENERIMA KONFIRMASI DARI DASHBOARD
  window.addEventListener('message', event => {
    if (event.origin !== returnOrigin) return;
    if (event.source !== window.opener) return;

    const data = event.data;

    if (!data || data.type !== 'IPM_ATTENDANCE_RESULT') return;

    clearTimeout(scanTimeout);

    waitingResult = false;
    sent = false;
    startBtn.disabled = false;

    showResult(
      data.success === true,
      data.message || (
        data.success ? 'Data kehadiran tersimpan.' :
        'Data kehadiran gagal disimpan.'
      ),
      data.name || ''
    );
  });

  document.getElementById('close-modal').addEventListener('click', () => {
    modal.classList.remove('show');

    if (!waitingResult) {
      startBtn.disabled = false;
      status('Siap melakukan pemindaian berikutnya.');
    }
  });

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);

  window.addEventListener('beforeunload', () => {
    clearTimeout(scanTimeout);
    if (scanner) {
      try { scanner.stop(); } catch (e) {}
    }
  });

  loadCameras().then(() => {
    status('Kamera ditemukan. Tekan Mulai Scan.', 'ok');
  }).catch(err => {
    status('Kamera belum tersedia: ' + err.message, 'err');
  });
})();
</script>
</body>
</html>
