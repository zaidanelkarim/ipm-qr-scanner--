<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner QR Absensi IPM</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;color:#e5edff;background:#070e22}
.wrap{max-width:560px;margin:0 auto}.panel{background:#101b36;border:1px solid rgba(148,163,184,.2);border-radius:20px;padding:22px;box-shadow:0 18px 48px #0004}
h1{margin:0 0 8px;font-size:22px}p{color:#a9bad8;line-height:1.55}
#reader{overflow:hidden;border-radius:14px;background:#071126;min-height:260px}#reader video{object-fit:cover!important;border-radius:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;color:white;background:#2563eb}
button.secondary{background:#263958}button:disabled{opacity:.55;cursor:not-allowed}
#status{margin-top:14px;padding:12px;border-radius:10px;background:#172747;font-size:14px}
.small{font-size:12px}.ok{color:#86efac}.bad{color:#fda4af}
select{width:100%;padding:10px;margin:12px 0;border-radius:9px;background:#0b1630;color:#e5edff;border:1px solid #425578}
</style>
</head>
<body>
<main class="wrap"><section class="panel">
<h1>Scanner QR Code IPM</h1>
<p>Izinkan akses kamera, lalu arahkan QR Code peserta ke area pemindaian. Setelah terbaca, hasil dikirim kembali ke dashboard absensi.</p>
<label for="camera-select" class="small">Pilih kamera</label>
<select id="camera-select"><option value="">Kamera otomatis (belakang)</option></select>
<div id="reader"></div>
<div class="actions">
<button id="start-btn" type="button">Mulai Kamera</button>
<button id="stop-btn" type="button" class="secondary" disabled>Hentikan</button>
<button id="back-btn" type="button" class="secondary">Kembali ke Dashboard</button>
</div>
<div id="status" role="status">Siap. Tekan “Mulai Kamera” untuk meminta izin kamera.</div>
<p class="small">Akses kamera memerlukan HTTPS dan izin kamera dari browser.</p>
</section></main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const returnOrigin = params.get('returnOrigin');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start-btn');
  const stopBtn = document.getElementById('stop-btn');
  const cameraSelect = document.getElementById('camera-select');
  let scanner = null;
  let cameras = [];
  let sending = false;
  let restartTimer = null;
  let lastText = '';
  let lastSentAt = 0;

  function setStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.className = kind || '';
  }

  async function stopCamera() {
    const active = scanner;
    scanner = null;
    if (active) {
      try { await active.stop(); } catch (e) {}
      try { await active.clear(); } catch (e) {}
    }
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  async function startCamera() {
    if (scanner || sending) return;
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      setStatus('Kamera memerlukan halaman HTTPS dan browser yang mendukung akses kamera.', 'bad');
      return;
    }
    if (!returnOrigin || !window.opener || window.opener.closed) {
      setStatus('Dashboard tidak terhubung. Buka scanner melalui tombol Scanner Eksternal pada dashboard.', 'bad');
      return;
    }
    try {
      cameras = await Html5Qrcode.getCameras();
      cameraSelect.innerHTML = '<option value="">Kamera belakang (otomatis)</option>';
      cameras.forEach((cam, i) => {
        const option = document.createElement('option');
        option.value = cam.id;
        option.textContent = cam.label || ('Kamera ' + (i + 1));
        cameraSelect.appendChild(option);
      });

      const activeScanner = new Html5Qrcode('reader', {
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
      });
      scanner = activeScanner;
      const cameraConfig = cameraSelect.value || { facingMode: 'environment' };
      await activeScanner.start(cameraConfig, {
        fps: 12,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1
      }, async decodedText => {
        const now = Date.now();
        if (sending || (decodedText === lastText && now - lastSentAt < 2500)) return;
        sending = true;
        lastText = decodedText;
        lastSentAt = now;
        setStatus('QR terbaca. Mengirim data ke dashboard Admin...', 'ok');
        await stopCamera();

        if (!window.opener || window.opener.closed) {
          sending = false;
          setStatus('Dashboard terputus. Buka kembali scanner dari dashboard.', 'bad');
          return;
        }
        window.opener.postMessage({ type: 'IPM_QR_SCAN', text: decodedText }, returnOrigin);
        setStatus('QR terkirim. Menunggu hasil pencatatan dari dashboard...', 'ok');
      }, () => {});

      startBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus('Kamera aktif. Arahkan QR Code peserta ke kotak pemindaian.', 'ok');
    } catch (err) {
      console.error(err);
      if (scanner) {
        const failed = scanner;
        scanner = null;
        try { await failed.stop(); } catch (e) {}
        try { await failed.clear(); } catch (e) {}
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus('Kamera gagal dibuka: ' + (err?.message || err) + '. Periksa izin kamera.', 'bad');
    }
  }

  // Dashboard mengirim hasil setelah server menyimpan / menolak absensi.
  window.addEventListener('message', event => {
    if (event.origin !== returnOrigin || event.source !== window.opener) return;
    const data = event.data || {};
    if (data.type !== 'IPM_ATTENDANCE_RESULT') return;

    const detail = data.name ? (' · ' + data.name + ' (' + (data.id || '-') + ')') : '';
    const session = data.session ? (' · ' + data.session) : '';
    setStatus((data.success ? 'BERHASIL: ' : 'PERINGATAN: ') + (data.message || 'Hasil absensi diterima.') + detail + session,
      data.success ? 'ok' : 'bad');

    sending = false;
    if (restartTimer) clearTimeout(restartTimer);
    // Kamera diaktifkan kembali otomatis agar siap untuk peserta berikutnya.
    restartTimer = setTimeout(() => {
      if (!document.hidden && !scanner) startCamera();
    }, 1200);
  });

  startBtn.addEventListener('click', startCamera);
  stopBtn.addEventListener('click', stopCamera);
  cameraSelect.addEventListener('change', async () => {
    if (scanner) {
      await stopCamera();
      await startCamera();
    }
  });
  document.getElementById('back-btn').addEventListener('click', async () => {
    await stopCamera();
    if (window.opener && !window.opener.closed) window.close();
    else history.back();
  });
  window.addEventListener('beforeunload', () => {
    if (restartTimer) clearTimeout(restartTimer);
    if (scanner) { try { scanner.stop(); } catch (e) {} }
  });
})();
</script>
</body></html>
