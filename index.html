<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070e22">
  <title>Scanner QR IPM</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark;--bg:#070e22;--panel:#101b36;--panel2:#0b1630;--text:#e5edff;--muted:#9aabc9;--border:#29436b;--reader:#071126;--button:#00843D;--secondary:#24395f}
    html[data-theme="light"]{color-scheme:light;--bg:#f1f5f9;--panel:#ffffff;--panel2:#f8fafc;--text:#172033;--muted:#64748b;--border:#cbd5e1;--reader:#e2e8f0;--button:#00843D;--secondary:#e2e8f0}
    body{margin:0;padding:22px;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',Arial,sans-serif;min-height:100vh;transition:background .2s,color .2s}
    .wrap{max-width:480px;margin:0 auto;background:var(--panel);border:1px solid #00843D;border-radius:18px;padding:20px;box-shadow:0 18px 50px #0003;transition:background .2s}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{font-size:22px;margin:0 0 8px}.muted{color:var(--muted);font-size:14px;line-height:1.5}
    #reader{width:100%;margin:18px 0;border-radius:12px;overflow:hidden;background:var(--reader);min-height:240px}
    button,select{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;font-size:15px;font-weight:700}
    button{background:var(--button);color:white;cursor:pointer}button.secondary{background:var(--secondary);color:var(--text);border:1px solid var(--border)}button:disabled{opacity:.55;cursor:not-allowed}
    select{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
    .status{padding:12px;border-radius:10px;background:var(--panel2);margin-top:12px;font-size:14px;line-height:1.5;border:1px solid var(--border)}
    .ok{background:#00843D;color:#ffffff;border-color:#00843D}.err{background:#7f1d1d;color:#fee2e2;border-color:#991b1b}
    .theme-btn{width:auto;margin:0;padding:10px 12px;background:var(--panel2);color:var(--text);border:1px solid var(--border);font-size:13px;white-space:nowrap}
    @media(max-width:420px){body{padding:12px}.wrap{padding:16px}.top{align-items:flex-start}h1{font-size:20px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div><h1>Scanner QR Code IPM</h1></div>
      <button id="theme-toggle" class="theme-btn" type="button" onclick="toggleScannerTheme()" aria-label="Ganti tema">☀️ Mode Terang</button>
    </div>
    <p class="muted">Arahkan kamera ke QR Code peserta. Hasil pemindaian akan dikirim ke sistem absensi Musycab.</p>
    <select id="camera-select" aria-label="Pilih kamera"><option value="">Kamera akan dimuat…</option></select>
    <div id="reader"></div>
    <button id="start-btn" type="button">Mulai Scan</button>
    <button id="stop-btn" type="button" class="secondary" disabled>Hentikan Kamera</button>
    <div id="status" class="status">Menunggu kamera. Tekan “Mulai Scan” dan izinkan akses kamera.</div>
  </main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyxWz7LdGZjef31fUVcNnxC83a9tBB8Jz6LEsXgO588igXx47O5BnkS9wBddz6lE9kU/exec';
  // Masukkan PIN scanner yang sama dengan Script Properties SCANNER_PIN.
  const SCANNER_PIN = 'GANTI_PIN_ANDA';
  const SESSION_ID = params.get('sessionId') || 'SESI_1';
  const statusEl = document.getElementById('status');
  const select = document.getElementById('camera-select');
  const startBtn = document.getElementById('start-btn');
  const stopBtn = document.getElementById('stop-btn');
  let scanner = null;
  let cameras = [];
  let sent = false;

  function status(message, type) { statusEl.textContent = message; statusEl.className = 'status' + (type ? ' ' + type : ''); }
  const WEB_APP_URL_CLEAN = String(WEB_APP_URL || '').trim();
  const SCANNER_PIN_CLEAN = String(SCANNER_PIN || '').trim();
  const CONFIG_VALID = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(WEB_APP_URL_CLEAN) && /^[A-Za-z0-9]{6,8}$/.test(SCANNER_PIN_CLEAN);
  if (!CONFIG_VALID) {
    status('URL Web App atau PIN scanner belum valid. Periksa konfigurasi pada file scanner.', 'err');
    startBtn.disabled = true;
    throw new Error('Konfigurasi scanner belum lengkap.');
  }

  function sendToAttendanceServer(participantId) {
    return new Promise((resolve, reject) => {
      const callbackName = 'ipmScanCallback_' + Date.now();
      let script = document.createElement('script');
      const timeout = setTimeout(() => { cleanup(); reject(new Error('Server tidak merespons. Periksa koneksi internet.')); }, 15000);
      function cleanup() { clearTimeout(timeout); delete window[callbackName]; if (script && script.parentNode) script.parentNode.removeChild(script); }
      window[callbackName] = result => { cleanup(); resolve(result); };
      const query = new URLSearchParams({action:'scan',pin:SCANNER_PIN_CLEAN,id:participantId,sessionId:SESSION_ID,callback:callbackName,_:String(Date.now())});
      script.onerror = () => { cleanup(); reject(new Error('Tidak dapat menghubungi endpoint Apps Script.')); };
      script.src = WEB_APP_URL_CLEAN + '?' + query.toString();
      document.head.appendChild(script);
    });
  }
  async function loadCameras() {
    try {
      cameras = await Html5Qrcode.getCameras(); select.innerHTML = '';
      if (!cameras.length) throw new Error('Tidak ada kamera yang terdeteksi.');
      cameras.forEach((camera,index) => { const option=document.createElement('option');option.value=camera.id;option.textContent=camera.label||('Kamera '+(index+1));select.appendChild(option); });
      const back=cameras.find(c=>/back|rear|environment|belakang/i.test(c.label||''));if(back)select.value=back.id;
      status('Kamera ditemukan. Tekan “Mulai Scan” untuk memulai.','ok');
    } catch(err) { status('Tidak dapat mengakses kamera: '+(err.message||err)+'. Pastikan HTTPS dan izin kamera aktif.','err'); }
  }
  async function start() {
    if(scanner)return;
    if(typeof Html5Qrcode==='undefined'){status('Library pemindai gagal dimuat. Periksa koneksi internet.','err');return;}
    startBtn.disabled=true;
    try {
      await loadCameras(); scanner=new Html5Qrcode('reader');
      const cameraId=select.value||{facingMode:'environment'};
      await scanner.start(cameraId,{fps:12,qrbox:(width,height)=>{const size=Math.floor(Math.min(width,height)*.78);return{width:size,height:size};},aspectRatio:1},async decodedText=>{
        if(sent)return;sent=true;status('QR terbaca. Mengirim ke server absensi…','ok');
        try {
          const idMatch=String(decodedText||'').toUpperCase().match(/IPM-\d+/);
          if(!idMatch)throw new Error('QR tidak memuat ID peserta IPM yang valid.');
          const result=await sendToAttendanceServer(idMatch[0]);
          status((result.success?'BERHASIL: ':'GAGAL: ')+(result.message||'Tidak ada keterangan.'),result.success?'ok':'err');
        } catch(err) { status('Pengiriman gagal: '+(err.message||err),'err'); }
        setTimeout(()=>{sent=false;status('Siap memindai peserta berikutnya.','ok');},1800);
      },()=>{});
      stopBtn.disabled=false;status('Kamera aktif. Arahkan QR Code ke dalam kotak pemindai.','ok');
    } catch(err) { console.error(err);try{if(scanner)await scanner.clear();}catch(e){}scanner=null;startBtn.disabled=false;stopBtn.disabled=true;status('Kamera gagal dijalankan: '+(err.message||err)+'. Periksa izin kamera browser.','err'); }
  }
  async function stop() { if(scanner){try{await scanner.stop();}catch(e){}try{scanner.clear();}catch(e){}scanner=null;}startBtn.disabled=false;stopBtn.disabled=true;status('Kamera dihentikan. Tekan “Mulai Scan” untuk mencoba lagi.'); }
  startBtn.addEventListener('click',start);stopBtn.addEventListener('click',stop);
  window.addEventListener('beforeunload',()=>{if(scanner){try{scanner.stop();}catch(e){}}});
})();

function applyScannerTheme(theme){const chosen=theme==='light'?'light':'dark';document.documentElement.setAttribute('data-theme',chosen);try{localStorage.setItem('ipm_scanner_theme',chosen);}catch(e){}const b=document.getElementById('theme-toggle');if(b)b.textContent=chosen==='dark'?'☀️ Mode Terang':'🌙 Mode Gelap';const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=chosen==='dark'?'#070e22':'#f1f5f9';}
function toggleScannerTheme(){const current=document.documentElement.getAttribute('data-theme')||'dark';applyScannerTheme(current==='dark'?'light':'dark');}
(function initScannerTheme(){let saved='dark';try{saved=localStorage.getItem('ipm_scanner_theme')||'dark';}catch(e){}applyScannerTheme(saved);})();
</script>
</body>
</html>
