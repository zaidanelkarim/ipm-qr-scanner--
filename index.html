<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner QR Absensi IPM</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;color:#e5edff;background:#070e22}
.wrap{max-width:560px;margin:0 auto}.panel{background:#101b36;border:1px solid rgba(148,163,184,.2);border-radius:20px;padding:22px;box-shadow:0 18px 48px #0004}
h1{margin:0 0 8px;font-size:22px}p{color:#a9bad8;line-height:1.55}
#reader{overflow:hidden;border-radius:14px;background:#071126;min-height:260px}#reader video{object-fit:cover!important;border-radius:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;color:white;background:#2563eb}
button.secondary{background:#263958}button:disabled{opacity:.55;cursor:not-allowed}
#status{margin-top:14px;padding:12px;border-radius:10px;background:#172747;font-size:14px}
.small{font-size:12px}.ok{color:#86efac}.bad{color:#fda4af}
select{width:100%;padding:10px;margin:12px 0;border-radius:9px;background:#0b1630;color:#e5edff;border:1px solid #425578}
</style>
</head>
<body>
<main class="wrap"><section class="panel">
<h1>Scanner QR Code IPM</h1>
<p>Izinkan akses kamera, lalu arahkan QR Code peserta ke area pemindaian. Setelah terbaca, hasil dikirim kembali ke dashboard absensi.</p>
<label for="camera-select" class="small">Pilih kamera</label>
<select id="camera-select"><option value="">Kamera otomatis (belakang)</option></select>
<div id="reader"></div>
<div class="actions">
<button id="start-btn" type="button">Mulai Kamera</button>
<button id="stop-btn" type="button" class="secondary" disabled>Hentikan</button>
<button id="back-btn" type="button" class="secondary">Kembali ke Dashboard</button>
</div>
<div id="status" role="status">Siap. Tekan “Mulai Kamera” untuk meminta izin kamera.</div>
<p class="small">Akses kamera memerlukan HTTPS dan izin kamera dari browser.</p>
</section></main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const returnOrigin = params.get('returnOrigin');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start-btn');
  const stopBtn = document.getElementById('stop-btn');
  const cameraSelect = document.getElementById('camera-select');
  let scanner = null, cameras = [], sending = false;

  function setStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.className = kind || '';
  }
  async function stopCamera() {
    if (!scanner) return;
    const active = scanner; scanner = null;
    try { await active.stop(); } catch(e) {}
    try { await active.clear(); } catch(e) {}
    startBtn.disabled = false; stopBtn.disabled = true;
  }
  async function startCamera() {
    if (scanner) return;
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      setStatus('Kamera memerlukan halaman HTTPS dan browser yang mendukung akses kamera.', 'bad');
      return;
    }
    try {
      cameras = await Html5Qrcode.getCameras();
      cameraSelect.innerHTML = '<option value="">Kamera belakang (otomatis)</option>';
      cameras.forEach((cam,i) => {
        const option=document.createElement('option');
        option.value=cam.id; option.textContent=cam.label || ('Kamera '+(i+1));
        cameraSelect.appendChild(option);
      });
      scanner = new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]});
      const cameraConfig = cameraSelect.value || {facingMode:'environment'};
      await scanner.start(cameraConfig,{fps:12,qrbox:{width:250,height:250},aspectRatio:1},
        async decodedText => {
          if(sending) return;
          sending=true; setStatus('QR terbaca. Mengirim hasil ke dashboard...','ok');
          await stopCamera();
          if(!window.opener || window.opener.closed) {
            setStatus('Dashboard asal tidak ditemukan. Buka scanner dari tombol Scanner Eksternal di dashboard.','bad');
            sending=false; return;
          }
          if(!returnOrigin) {
            setStatus('Alamat tujuan dashboard tidak ditemukan. Buka ulang scanner dari dashboard.','bad');
            sending=false; return;
          }
          window.opener.postMessage({type:'IPM_QR_SCAN',text:decodedText},returnOrigin);
          setStatus('Hasil QR dikirim. Tab scanner akan ditutup.','ok');
          setTimeout(()=>window.close(),700);
        },()=>{});
      startBtn.disabled=true; stopBtn.disabled=false;
      setStatus('Kamera aktif. Arahkan QR Code peserta ke kotak pemindaian.','ok');
    } catch(err) {
      console.error(err); scanner=null; startBtn.disabled=false; stopBtn.disabled=true;
      setStatus('Kamera gagal dibuka: '+(err?.message || err)+'. Periksa izin kamera dan tutup aplikasi lain yang memakai kamera.','bad');
    }
  }
  startBtn.addEventListener('click',startCamera);
  stopBtn.addEventListener('click',stopCamera);
  cameraSelect.addEventListener('change',async()=>{if(scanner){await stopCamera();await startCamera();}});
  document.getElementById('back-btn').addEventListener('click',()=> {
    if(window.opener && !window.opener.closed) window.close(); else history.back();
  });
  window.addEventListener('beforeunload',()=>{if(scanner){try{scanner.stop();}catch(e){}}});
})();
</script>
</body></html>
